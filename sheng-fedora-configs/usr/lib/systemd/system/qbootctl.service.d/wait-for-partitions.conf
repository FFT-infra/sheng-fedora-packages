# qbootctl reaches the partitions through /dev/disk/by-partlabel/boot_{a,b},
# symlinks created by udev. The shipped unit only orders itself after
# local-fs.target, which covers the LUN holding the root filesystem. These
# partitions live on a different UFS LUN (root is /dev/sda29 here while
# boot_a is /dev/sde14), and udev processes that one independently. When
# qbootctl runs first it fails with
#   gpt_get_headers: Failed to resolve path for boot_a
# the slot is never marked successful, the retry counter decrements on every
# boot, and the device eventually falls into fastboot.
#
# udev tags these partitions for systemd, so the device units can be used
# directly. Both slots are listed because the device may run from either;
# they sit on the same LUN, so depending on both adds no extra wait.
[Unit]
After=dev-disk-by\x2dpartlabel-boot_a.device dev-disk-by\x2dpartlabel-boot_b.device
Wants=dev-disk-by\x2dpartlabel-boot_a.device dev-disk-by\x2dpartlabel-boot_b.device
